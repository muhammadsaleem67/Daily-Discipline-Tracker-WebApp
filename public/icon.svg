<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D2A00" />
      <stop offset="100%" stop-color="#1B0F03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A900" />
      <stop offset="100%" stop-color="#CC6F00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6E3B00" stroke-width="8" opacity="0.8" />
  
  <!-- Outer Shield Crest -->
  <path d="M 256 64 L 400 120 L 400 270 C 400 370 256 448 256 448 C 256 448 112 370 112 270 L 112 120 Z" 
        fill="#261502" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Discipline Flame Symbol -->
  <g filter="url(#glow)">
    <path d="M 256 150 
             C 280 210 330 240 330 310 
             C 330 355 298 390 256 390 
             C 214 390 182 355 182 310 
             C 182 250 230 200 256 150 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Core Inner Flame in Light Cream -->
    <path d="M 256 240 
             C 268 275 292 295 292 330 
             C 292 352 276 370 256 370 
             C 236 370 220 352 220 330 
             C 220 300 244 270 256 240 Z" 
          fill="#F9E6A8" />
  </g>

  <!-- Crown / Spartan Notch Marks -->
  <path d="M 226 100 L 256 80 L 286 100" fill="none" stroke="#F9E6A8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
